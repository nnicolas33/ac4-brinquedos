<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Painel - Brinquedos Esportivos</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<header>
    <h1>Brinquedos Esportivos</h1>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="botao">Sair</button>
    </form>
</header>

<main class="conteudo">
    <h2>
        Olá, <span th:text="${usuario}">usuario</span>
        <span class="perfil admin" th:if="${admin}">ADMIN</span>
        <span class="perfil user" th:unless="${admin}">USER</span>
    </h2>

    <p th:if="${admin}" style="margin-top:8px">Como administrador, você pode consultar, cadastrar, editar e excluir brinquedos pela API.</p>
    <p th:unless="${admin}" style="margin-top:8px">Como usuário, você pode consultar o catálogo de brinquedos.</p>

    <table>
        <thead>
        <tr>
            <th>Id</th><th>Nome</th><th>Tipo</th><th>Idade</th><th>Tamanho</th><th>Preço</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${brinquedos}">
            <td th:text="${b.id}"></td>
            <td th:text="${b.nome}"></td>
            <td th:text="${b.tipo}"></td>
            <td th:text="|até ${b.classificacao} anos|"></td>
            <td th:text="${b.tamanho}"></td>
            <td th:text="|R$ ${#numbers.formatDecimal(b.preco, 1, 'POINT', 2, 'COMMA')}|"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(brinquedos)}">
            <td colspan="6">Nenhum brinquedo cadastrado ainda.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
